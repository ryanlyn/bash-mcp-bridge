[package]
name = "bash-mcp-bridge"
version = "0.1.0"
edition = "2021"
description = "MCP server that lets sandboxed agents execute host CLI commands against a binary whitelist"
license = "MIT"
repository = "https://github.com/ryanlyn/bash-mcp-bridge"
keywords = ["mcp", "cli", "sandbox", "agent"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
rmcp = { version = "1.2", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shlex = "1"
axum = "0.8"

[dev-dependencies]
tempfile = "3"

serde_json = "1"
